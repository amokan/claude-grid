name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version
      - run: shellcheck -x bin/claude-grid install.sh libexec/claude-grid/*.sh tests/run.sh

  test:
    name: test (${{ matrix.bash }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The bash macOS ships (3.2) and a current one, which treats unset variables more strictly.
        bash: [/bin/bash, /opt/homebrew/bin/bash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install tmux bash
      - run: tmux -V && ${{ matrix.bash }} --version | head -n 1
      - run: ${{ matrix.bash }} tests/run.sh
