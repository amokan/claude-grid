# Config for the private tmux servers that claude-grid starts, one per grid.
# claude-grid starts each server with a generated file that sources this one, then applies the
# user's settings (prefix, colors, float size, timing) and finally ~/.config/claude-grid/tmux.local.conf.
# That file also sets @cg_bin, @cg_libexec and @cg_state, which the commands below use.
# Every state also has a symbol and a word, not only a color.

unbind C-b

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "claude-grid#{?#{==:#{@cg_grid},main},, #{@cg_grid}}"

set -g initial-repeat-time 0

set -g main-pane-height 65%
set -g main-pane-width 65%

# Pane titles (set by Claude Code from the conversation) and folder names are shown with any
# "#[" removed, so they can't restyle the border, e.g. to fake or hide NEEDS INPUT.
set -g pane-border-status top
set -g pane-border-lines spaces
set -g pane-border-format "#{?#{==:#{@claude_state},waiting},#[fg=black bold] ⚠ #{pane_index}:#{s/#\\[/[/:@claude_name}  NEEDS INPUT ,#{?pane_active,#[fg=black bold],#[fg=#{@cg_color_text}]} #{?#{==:#{@claude_state},done},✓,#{?#{==:#{@claude_state},working},●,○}} #{pane_index}:#{s/#\\[/[/:@claude_name}#{?#{==:#{@claude_state},done},  done,#{?#{==:#{@claude_state},working},  working,}} #[nobold]· #{s/#\\[/[/:pane_title} }"

set -g status-left "#[fg=#{@cg_color_active} bold] claude-grid#{?#{==:#{@cg_grid},main},, #{@cg_grid}} #[default]#{?#{!=:#{@cg_autofloat},off},#[fg=black bg=#{@cg_color_active}] auto-float #[default],}#{P:#{?#{==:#{@claude_state},waiting}, #[fg=black bg=#{@cg_color_waiting} bold] ⚠ #{pane_index}:#{s/#\\[/[/:@claude_name} #[default],}} "
set -g status-left-length 120
set -g status-right "#[fg=#a0a0a0]#{@cg_prefix} +  a: next waiting  1-9: pane  f/F: float  Esc: unfloat  p: promote  g: grid  z: zoom  c/C: new claude  q: close all "
set -g status-right-length 110
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""

set-hook -g after-select-pane 'if -F "#{||:#{==:#{@claude_state},waiting},#{==:#{@claude_state},done}}" "set -p @claude_state idle"'
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{@claude_state},waiting},#{==:#{@claude_state},done}}" "set -p @claude_state idle"'
set -s command-alias[100] "cg-autofloat=if -F '#{&&:#{!=:#{@cg_autofloat},off},#{!=:#{@cg_skip_float},1}}' 'run-shell \"#{q:@cg_libexec}/float.sh focus #{pane_id}\"'"
set-hook -g 'after-select-pane[1]' cg-autofloat
set-hook -g window-resized 'run-shell "#{q:@cg_libexec}/float.sh refit #{pane_id}"'

bind -n MouseDown1Pane if -F "#{&&:#{!=:#{pane_floating_flag},1},#{!=:#{P:#{?pane_floating_flag,x,}},}}" \
  "set -g @cg_skip_float 1 ; run-shell \"#{q:@cg_libexec}/float.sh sink #{pane_id}\" ; select-pane -t = ; set -gu @cg_skip_float" \
  "select-pane -t = ; cg-autofloat ; send-keys -M"

bind p set -g @cg_autofloat off \; run-shell "#{q:@cg_libexec}/float.sh sink #{pane_id}" \; swap-pane -s . -t "{top-left}" \; select-pane -t "{top-left}" \; select-layout main-horizontal
bind g set -g @cg_autofloat off \; run-shell "#{q:@cg_libexec}/float.sh sink #{pane_id}" \; select-layout tiled
bind f run-shell "#{q:@cg_libexec}/float.sh toggle #{pane_id}"
bind F run-shell "#{q:@cg_libexec}/float.sh auto #{pane_id}"
bind -r Enter run-shell "#{q:@cg_libexec}/float.sh focus #{pane_id}"
bind -r Up if -F "#{!=:#{@cg_autofloat},off}" "select-pane -t :.-" "select-pane -U"
bind -r Down if -F "#{!=:#{@cg_autofloat},off}" "select-pane -t :.+" "select-pane -D"
bind -r Left if -F "#{!=:#{@cg_autofloat},off}" "select-pane -t :.-" "select-pane -L"
bind -r Right if -F "#{!=:#{@cg_autofloat},off}" "select-pane -t :.+" "select-pane -R"
bind Escape run-shell "#{q:@cg_libexec}/float.sh sink #{pane_id}"
bind -r 1 select-pane -t :.1 \; cg-autofloat
bind -r 2 select-pane -t :.2 \; cg-autofloat
bind -r 3 select-pane -t :.3 \; cg-autofloat
bind -r 4 select-pane -t :.4 \; cg-autofloat
bind -r 5 select-pane -t :.5 \; cg-autofloat
bind -r 6 select-pane -t :.6 \; cg-autofloat
bind -r 7 select-pane -t :.7 \; cg-autofloat
bind -r 8 select-pane -t :.8 \; cg-autofloat
bind -r 9 select-pane -t :.9 \; cg-autofloat
bind -r a run-shell "#{q:@cg_libexec}/next-waiting.sh"
bind c run-shell "#{q:@cg_bin} --grid #{q:@cg_grid} #{q:pane_current_path}"
bind C command-prompt -p "claude in dir:" "run-shell \"#{q:@cg_bin} --grid #{q:@cg_grid} %1\""
bind q confirm-before -p "Close ALL Claude panes and end this grid? (y/n)" kill-server
bind r source-file -F "#{@cg_state}/grid.conf" \; display-message "claude-grid config reloaded"
